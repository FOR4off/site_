<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOBBY_STAFF | Нет соединения</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        
        .offline-container {
            max-width: 500px;
        }
        
        .offline-icon {
            font-size: 80px;
            color: #00ffff;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .offline-logo {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #9d00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        .offline-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .offline-message {
            color: #b0b0b0;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .offline-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: linear-gradient(135deg, #00ffff, #9d00ff);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transition: all 0.3s;
        }
        
        .offline-btn:hover {
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }
        
        .offline-hint {
            color: #666666;
            margin-top: 24px;
            font-size: 14px;
        }
        
        .offline-hint a {
            color: #00ffff;
            text-decoration: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <i class="bi bi-wifi-off offline-icon"></i>
        <div class="offline-logo">LOBBY_STAFF</div>
        <h1 class="offline-title">Нет соединения с интернетом</h1>
        <p class="offline-message">
            Кажется, вы не подключены к интернету. Проверьте соединение и попробуйте снова.
        </p>
        <button class="offline-btn" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise"></i>
            Попробовать снова
        </button>
        <p class="offline-hint">
            Если проблема сохраняется, свяжитесь с нами:<br>
            <a href="mailto:hello@lobbystaff.ru">hello@lobbystaff.ru</a>
        </p>
    </div>
</body>
</html>
